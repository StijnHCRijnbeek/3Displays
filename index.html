<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Website</title>

    <!-- Google Fonts: Inter voor een strak, modern lettertype -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS voor eenvoudige opmaak -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen flex flex-col bg-white text-slate-900 font-sans antialiased">

    <!-- =====================================================================
         BOVENSTE NAVIGATIEBALK (HEADER)
         Links staat de titel van je website, rechts staan de pagina-links.
         ===================================================================== -->
    <header class="sticky top-0 z-50 w-full bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-4">

            <!-- WEBSITE TITEL (LINKS) - Pas "Mijn Website" hieronder gerust aan -->
            <a
                href="#pagina-1"
                data-page-target="pagina-1"
                class="nav-title text-base sm:text-lg font-medium text-slate-800 hover:text-slate-950 tracking-tight truncate focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded"
            >
                Mijn Website
            </a>

            <!-- PAGINA NAVIGATIE (RECHTS) -->
            <nav aria-label="Paginanavigatie" class="flex items-center gap-1 sm:gap-2">
                <button
                    type="button"
                    data-page-target="pagina-1"
                    aria-current="page"
                    class="nav-link relative px-3 py-2 text-sm font-semibold text-blue-600 rounded-md transition-colors duration-150 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                >
                    <span>Pagina 1</span>
                    <span class="nav-indicator absolute left-2 right-2 -bottom-[13px] h-0.5 bg-blue-600 rounded-full transition-opacity duration-150 opacity-100"></span>
                </button>

                <button
                    type="button"
                    data-page-target="pagina-2"
                    class="nav-link relative px-3 py-2 text-sm font-medium text-slate-600 rounded-md transition-colors duration-150 hover:text-slate-900 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                >
                    <span>Pagina 2</span>
                    <span class="nav-indicator absolute left-2 right-2 -bottom-[13px] h-0.5 bg-blue-600 rounded-full transition-opacity duration-150 opacity-0"></span>
                </button>

                <button
                    type="button"
                    data-page-target="pagina-3"
                    class="nav-link relative px-3 py-2 text-sm font-medium text-slate-600 rounded-md transition-colors duration-150 hover:text-slate-900 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                >
                    <span>Pagina 3</span>
                    <span class="nav-indicator absolute left-2 right-2 -bottom-[13px] h-0.5 bg-blue-600 rounded-full transition-opacity duration-150 opacity-0"></span>
                </button>

                <!-- TIP: Wil je een 4e pagina? Kopieer één <button> hierboven,
                     verander data-page-target="pagina-4" en maak onderaan een
                     extra <section id="pagina-4"> aan. -->
            </nav>

        </div>
    </header>

    <!-- =====================================================================
         HOOFDGEDEELTE VAN DE WEBSITE (100% LEEG WIT CANVAS)
         Elke <section> hieronder is een eigen lege pagina.
         ===================================================================== -->
    <main class="flex-1 w-full bg-white">

        <!-- =================================================================
             INHOUD PAGINA 1
             Zet hier alles wat je op Pagina 1 wilt laten zien
             ================================================================= -->
        <section id="pagina-1" class="page-section w-full transition-opacity duration-200 opacity-100">
        </section>

        <!-- =================================================================
             INHOUD PAGINA 2
             Zet hier alles wat je op Pagina 2 wilt laten zien
             ================================================================= -->
        <section id="pagina-2" class="page-section hidden w-full transition-opacity duration-200 opacity-0">
        </section>

        <!-- =================================================================
             INHOUD PAGINA 3
             Zet hier alles wat je op Pagina 3 wilt laten zien
             ================================================================= -->
        <section id="pagina-3" class="page-section hidden w-full transition-opacity duration-200 opacity-0">
        </section>

    </main>

    <!-- =====================================================================
         JAVASCRIPT VOOR HET WISSELEN TUSSEN PAGINA'S
         Zorgt ervoor dat alleen de gekozen pagina zichtbaar is, zonder herladen.
         ===================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const navLinks = document.querySelectorAll('.nav-link');
                const navTriggers = document.querySelectorAll('[data-page-target]');
                const pageSections = document.querySelectorAll('.page-section');

                /**
                 * Toont de gekozen pagina en werkt de actieve knop in de balk bij.
                 * @param {string} pageId - Het id van de sectie (bijv. 'pagina-1')
                 */
                function switchPage(pageId) {
                    const targetSection = document.getElementById(pageId);
                    if (!targetSection) return;

                    // 1. Verberg alle pagina-secties
                    pageSections.forEach((section) => {
                        section.classList.add('hidden', 'opacity-0');
                        section.classList.remove('opacity-100');
                    });

                    // 2. Maak de gekozen pagina zichtbaar met een vloeiende overgang
                    targetSection.classList.remove('hidden');
                    window.requestAnimationFrame(() => {
                        targetSection.classList.remove('opacity-0');
                        targetSection.classList.add('opacity-100');
                    });

                    // 3. Werk de stijl van de navigatieknoppen rechtsboven bij
                    navLinks.forEach((link) => {
                        const isActive = link.getAttribute('data-page-target') === pageId;
                        const indicator = link.querySelector('.nav-indicator');

                        if (isActive) {
                            link.setAttribute('aria-current', 'page');
                            link.classList.remove('text-slate-600', 'font-medium');
                            link.classList.add('text-blue-600', 'font-semibold');
                            if (indicator) {
                                indicator.classList.remove('opacity-0');
                                indicator.classList.add('opacity-100');
                            }
                        } else {
                            link.removeAttribute('aria-current');
                            link.classList.remove('text-blue-600', 'font-semibold');
                            link.classList.add('text-slate-600', 'font-medium');
                            if (indicator) {
                                indicator.classList.remove('opacity-100');
                                indicator.classList.add('opacity-0');
                            }
                        }
                    });

                    // 4. Scroll rustig terug naar boven bij het wisselen van pagina
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

                // Koppel een klik-actie aan de titel en alle pagina-knoppen
                navTriggers.forEach((trigger) => {
                    trigger.addEventListener('click', (event) => {
                        event.preventDefault();
                        const targetPageId = trigger.getAttribute('data-page-target');
                        if (targetPageId) {
                            switchPage(targetPageId);
                        }
                    });
                });
            } catch (error) {
                console.error('Fout bij het wisselen van pagina:', error);
            }
        });
    </script>
</body>
</html>
